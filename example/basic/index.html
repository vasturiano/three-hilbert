<head>
  <style> body { margin: 0; } </style>

  <script type="importmap">{ "imports": {
    "three": "https://esm.sh/three",
    "three/": "https://esm.sh/three/"
  }}</script>

<!--  <script type="module">import * as THREE from 'three'; window.THREE = THREE;</script>-->
<!--  <script src="../../dist/three-hilbert.js" defer></script>-->
</head>

<body>
  <div id="chart"></div>

  <script type="module">
    import ThreeHilbert from 'https://esm.sh/three-hilbert?external=three';
    import * as THREE from 'three';
    import { TrackballControls } from 'three/examples/jsm/controls/TrackballControls.js?external=three';
    import { CSS2DRenderer } from 'three/examples/jsm/renderers/CSS2DRenderer.js?external=three';


    // Gen random data
    const N_CAT = 14;
    const MAX_VAL = 100;
    const data = [...Array(N_CAT)].map((_, i) => ({
      name: `Series ${i+1}`,
      val: Math.round(Math.random() * MAX_VAL)
    }));

    //

    const hilbertOrder = 5;
    const hilbertLength = Math.pow(8, hilbertOrder);

    const dataSum = data.map(({ val }) => val).reduce((acc, val) => acc + val, 0);
    const getHilbertVal = val => Math.round(val / dataSum * hilbertLength);

    let carry = 0;
    const hilbertData = data.map(({ val, ...rest }) => {
      const d = {
        start: carry,
        length: getHilbertVal(val),
        val,
        ...rest
      };
      carry += d.length;
      return d;
    });

    const Chart = new ThreeHilbert()
      .order(hilbertOrder)
      .padding(0.5)
      .data(hilbertData);

    // Setup renderers
    const renderers = [new THREE.WebGLRenderer(), new CSS2DRenderer()];
    renderers.forEach((r, idx) => {
      r.setSize(window.innerWidth, window.innerHeight);
      if (idx > 0) {
        // overlay additional on top of main renderer
        r.domElement.style.position = 'absolute';
        r.domElement.style.top = '0px';
        r.domElement.style.pointerEvents = 'none';
      }
      document.getElementById('chart').appendChild(r.domElement);
    });

    // Setup scene
    const scene = new THREE.Scene();
    scene.add(Chart);
    scene.add(new THREE.AmbientLight(0xcccccc, Math.PI));
    scene.add(new THREE.DirectionalLight(0xffffff, 0.6));

    // Setup camera
    const camera = new THREE.PerspectiveCamera();
    camera.far = 10000;
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    camera.position.x = 300;
    camera.position.y = 300;
    camera.position.z = 300;

    // Add camera controls
    const tbControls = new TrackballControls(camera, renderers[0].domElement);
    tbControls.addEventListener('change', () => Chart.setPointOfView(camera));
    Chart.setPointOfView(camera);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderers.forEach(r => r.setSize(window.innerWidth, window.innerHeight));
      tbControls.handleResize();
    });

    // Kick-off renderer
    (function animate() { // IIFE
      // Frame cycle
      tbControls.update();
      renderers.forEach(r => r.render(scene, camera));
      requestAnimationFrame(animate);
    })();
  </script>
</body>
